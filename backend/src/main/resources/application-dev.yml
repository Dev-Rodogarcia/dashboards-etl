app:
  environment: dev
  integration:
    satelite:
      url: ${APP_INTEGRATION_SATELITE_URL:http://127.0.0.1:19090}
    esl:
      graphql-url: ${ESL_GRAPHQL_URL:${API_GRAPHQL:}}
      api-base-url: ${API_BASEURL:${ESL_API_BASE_URL:${API_BASE_URL:}}}
      graphql-endpoint: ${API_GRAPHQL_ENDPOINT:/graphql}
      bearer-token: ${ESL_GRAPHQL_TOKEN:${API_GRAPHQL_TOKEN:}}
      corporation-document: ${ESL_CORPORATION_DOCUMENT:}
      requester-name: ${ESL_REQUESTER_NAME:}
      requester-email: ${ESL_REQUESTER_EMAIL:}
      requester-phone: ${ESL_REQUESTER_PHONE:}
      requester-department: ${ESL_REQUESTER_DEPARTMENT:}

spring:
  sql:
    init:
      mode: always
      data-locations:
        - optional:file:database/testdata/data-dev.sql
        - optional:file:../database/testdata/data-dev.sql
      encoding: UTF-8
      separator: "@@"

server:
  address: 127.0.0.1
  port: 5011

cors:
  origens-permitidas: http://127.0.0.1:5174,http://localhost:5174

security:
  trust-forwarded-headers: false

auth:
  refresh-cookie-secure: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:5010}

app:
  integration:
    satelite:
      url: ${APP_INTEGRATION_SATELITE_URL:http://127.0.0.1:19090}

spring:
  application:
    name: dashboard-api

  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:2MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:3MB}

  # SQL Server (credenciais lidas de dashboards/.env)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 40
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: SET ANSI_NULLS ON; SET QUOTED_IDENTIFIER ON

  flyway:
    enabled: true
    locations:
      - filesystem:database/migrations
      - filesystem:../database/migrations
    baseline-on-migrate: true
    baseline-version: 22
    baseline-description: Baseline schema existente ate V022
    validate-on-migrate: true
    out-of-order: false

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      jakarta:
        persistence:
          query:
            timeout: 30000  # 30s — suporta queries de até 365 dias em views grandes
    open-in-view: false

security:
  trust-forwarded-headers: ${SECURITY_TRUST_FORWARDED_HEADERS:false}
  headers:
    content-security-policy: ${SECURITY_HEADERS_CONTENT_SECURITY_POLICY:default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'}
  rate-limit:
    login:
      max-attempts: ${SECURITY_RATE_LIMIT_LOGIN_MAX_ATTEMPTS:10}
      window-seconds: ${SECURITY_RATE_LIMIT_LOGIN_WINDOW_SECONDS:900}
    api:
      max-requests: ${SECURITY_RATE_LIMIT_API_MAX_REQUESTS:120}
      window-seconds: ${SECURITY_RATE_LIMIT_API_WINDOW_SECONDS:60}
    export:
      max-requests: ${SECURITY_RATE_LIMIT_EXPORT_MAX_REQUESTS:12}
      window-seconds: ${SECURITY_RATE_LIMIT_EXPORT_WINDOW_SECONDS:60}

cors:
  origens-permitidas: ${CORS_ORIGENS_PERMITIDAS:}

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiracao-minutos: 15

auth:
  session-expiracao-horas: ${AUTH_SESSION_EXPIRACAO_HORAS:24}
  refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME:dashboard_refresh_token}
  refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
  refresh-cookie-same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

dashboard:
  periodo:
    zone-id: ${DASHBOARD_PERIODO_ZONE_ID:America/Sao_Paulo}
  indicadores:
    fail-on-schema-mismatch: ${DASHBOARD_INDICADORES_FAIL_ON_SCHEMA_MISMATCH:false}
    cubagem:
      remetente-docs-excluidos: ${DASHBOARD_INDICADORES_CUBAGEM_REMETENTE_DOCS_EXCLUIDOS:}
      pagador-docs-excluidos: ${DASHBOARD_INDICADORES_CUBAGEM_PAGADOR_DOCS_EXCLUIDOS:}

# API Key para rotas internas (ETL/RPA)
api:
  interno:
    key: ${API_KEY}

acl:
  storage-file: ${ACL_STORAGE_FILE:./storage/access-control.json}
  legacy:
    migration-enabled: ${ACL_LEGACY_MIGRATION_ENABLED:false}

acesso:
  usuario-supremo:
    email: ${ACESSO_USUARIO_SUPREMO_EMAIL}
    senha-inicial: ${ACESSO_USUARIO_SUPREMO_SENHA_INICIAL}
    nome: ${ACESSO_USUARIO_SUPREMO_NOME}
    papel: ${ACESSO_USUARIO_SUPREMO_PAPEL}
    nivel: ${ACESSO_USUARIO_SUPREMO_NIVEL}
    rotacionar-senha: ${ACESSO_USUARIO_SUPREMO_ROTACIONAR_SENHA:false}
  retencao:
    refresh-token-expirado-dias: ${ACESSO_RETENCAO_REFRESH_TOKEN_EXPIRADO_DIAS:30}
    audit-log-dias: ${ACESSO_RETENCAO_AUDIT_LOG_DIAS:90}
    cron: "${ACESSO_RETENCAO_CRON:0 30 3 * * *}"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

# Logging (complementar ao logback-spring.xml)
logging:
  level:
    com.dashboard.api: INFO
    # Para debugar filtros de data: habilitar temporariamente com DEBUG
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: INFO
